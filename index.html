<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2F7D72" />
<title>安心不跌倒｜高齡者跌倒預防衛教</title>
<style>
  :root{
    --bg:#F6F1E8;
    --paper:#FFFDF8;
    --paper-2:#FFF8EC;
    --ink:#263445;
    --muted:#6C7787;
    --primary:#2F7D72;
    --primary-dark:#235F57;
    --primary-soft:#E4F1ED;
    --accent:#E58A4B;
    --accent-soft:#FDEBD9;
    --danger:#C9504A;
    --danger-soft:#FBE9E7;
    --success:#2E8B6B;
    --line:#E8DFD1;
    --shadow:0 10px 28px rgba(58,49,35,.08);
    --radius:22px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:#EDE5D8;
    background-image:radial-gradient(#D9CDBB 1px,transparent 1px);
    background-size:22px 22px;
    -webkit-font-smoothing:antialiased;
    line-height:1.7;
  }
  button,textarea{font:inherit}
  button{cursor:pointer}
  a{color:var(--primary-dark)}

  .app{
    max-width:480px;
    min-height:100vh;
    margin:0 auto;
    background:var(--bg);
    position:relative;
    box-shadow:0 0 40px rgba(50,40,25,.12);
    overflow:clip;
  }

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:30;
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    background:rgba(246,241,232,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:42px;height:42px;flex:none;border-radius:14px;
    background:var(--primary);color:#fff;
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 6px 14px rgba(47,125,114,.25);
  }
  .brand-text h1{font-size:17px;margin:0;letter-spacing:.5px}
  .brand-text p{margin:0;font-size:11px;color:var(--muted);letter-spacing:1px}
  .progress-strip{
    display:flex;align-items:center;gap:10px;
    margin-top:12px;font-size:12px;color:var(--muted);
  }
  .progress-strip .bar{
    flex:1;height:8px;border-radius:99px;background:#E4DACE;overflow:hidden;
  }
  .progress-strip .bar > i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--primary),#4FAE94);
    transition:width .4s ease;
  }
  .progress-strip b{color:var(--primary-dark);font-variant-numeric:tabular-nums}

  /* View */
  .view{padding:18px 16px 118px}
  .page-head{margin:4px 2px 18px}
  .eyebrow{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;
    color:var(--primary-dark);background:var(--primary-soft);
    padding:4px 10px;border-radius:99px;margin-bottom:8px;
  }
  .page-head h2{font-size:24px;line-height:1.35;margin:0 0 6px}
  .page-head p{margin:0;color:var(--muted);font-size:14px}

  .card{
    background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-bottom:14px;
  }
  .card.tint{background:var(--paper-2)}
  .card h3{margin:0 0 10px;font-size:17px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:46px;padding:10px 18px;border-radius:14px;
    border:1px solid transparent;font-weight:700;font-size:15px;
    text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(47,125,114,.22)}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:#fff;color:var(--primary-dark);border-color:#CFE1DB}
  .btn-warm{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(229,138,75,.22)}
  .btn:disabled{background:#E3DED5;color:#9A9A94;box-shadow:none;cursor:not-allowed;border-color:transparent}
  .btn-block{width:100%}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row .btn{flex:1;min-width:130px}

  /* Home hero */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(145deg,#2F7D72,#245F59);
    color:#fff;border-radius:26px;padding:22px 20px;
    box-shadow:0 14px 30px rgba(35,95,87,.25);margin-bottom:16px;
  }
  .hero:after{
    content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;
    border-radius:50%;background:rgba(255,255,255,.09);
  }
  .hero .tag{font-size:11px;letter-spacing:2px;opacity:.85}
  .hero h2{font-size:27px;line-height:1.35;margin:8px 0 8px}
  .hero p{font-size:14px;opacity:.92;margin:0 0 18px;max-width:270px}
  .hero .btn{background:#fff;color:var(--primary-dark)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .stat{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:12px 6px;text-align:center;
  }
  .stat b{display:block;font-size:21px;color:var(--primary-dark);line-height:1.2}
  .stat span{font-size:11px;color:var(--muted)}
  .mini-list{list-style:none;padding:0;margin:10px 0 0}
  .mini-list li{
    display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px dashed var(--line);font-size:14px;
  }
  .mini-list li:last-child{border-bottom:0}
  .dot{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#EDE7DD;color:#8B8B85}
  .dot.done{background:var(--primary-soft);color:var(--primary-dark)}
  .note{font-size:12px;color:var(--muted);margin:10px 0 0}

  /* Reading chapters */
  .chapter{
    background:var(--paper);border:1px solid var(--line);border-radius:24px;
    box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;
  }
  .chapter-head{
    display:flex;align-items:flex-start;gap:12px;
    padding:18px 18px 14px;background:linear-gradient(180deg,#FFF9EE,#FFFDF8);
    border-bottom:1px solid var(--line);
  }
  .chapter-no{
    width:38px;height:38px;flex:none;border-radius:12px;
    background:var(--accent-soft);color:#A85B24;
    display:grid;place-items:center;font-weight:800;font-size:14px;
  }
  .chapter-head h3{margin:0;font-size:18px;line-height:1.35}
  .chapter-head p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:.5px}
  .chapter-icon{font-size:24px;margin-left:auto;flex:none}
  .chapter-body{padding:16px 18px 4px}
  .chapter-body h4{
    margin:18px 0 8px;font-size:15px;color:var(--primary-dark);
    display:flex;align-items:center;gap:7px;
  }
  .chapter-body h4:first-child{margin-top:0}
  .chapter-body h4:before{content:"";width:6px;height:16px;border-radius:99px;background:var(--accent)}
  .chapter-body p{margin:0 0 10px;font-size:14px}
  .chapter-body ul,.chapter-body ol{padding-left:20px;margin:0 0 12px;font-size:14px}
  .chapter-body li{margin-bottom:6px}
  .callout{
    background:var(--primary-soft);border-left:4px solid var(--primary);
    border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0;
  }
  .callout.warn{background:var(--danger-soft);border-left-color:var(--danger)}
  .fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
  .fact{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;
  }
  .fact b{display:block;font-size:13px;color:var(--primary-dark);margin-bottom:2px}
  .fact span{font-size:12px;color:var(--muted);line-height:1.55;display:block}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .pill{font-size:11px;padding:4px 9px;border-radius:99px;background:#F0EAE0;color:#6C6255}
  .video-card{
    display:flex;align-items:center;gap:12px;text-decoration:none;
    background:#24333F;color:#fff;border-radius:16px;padding:14px;margin:12px 0;
  }
  .video-card .play{width:38px;height:38px;border-radius:50%;background:#fff;color:#24333F;display:grid;place-items:center;flex:none}
  .video-card strong{font-size:14px;display:block}
  .video-card small{font-size:11px;opacity:.75;display:block;margin-top:2px}
  .table-wrap{overflow-x:auto;margin:12px 0 16px;border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;min-width:540px;font-size:12.5px;background:#fff}
  th,td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
  thead th{background:var(--primary-soft);color:var(--primary-dark);font-size:12px}
  tbody tr:last-child td{border-bottom:0}
  .exercise{
    border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:#fff;
  }
  .exercise h4{margin:0 0 8px}
  .exercise ol{margin-bottom:4px}
  .step-quick{font-size:12px;color:var(--muted);background:#F5F0E7;border-radius:10px;padding:8px 10px;display:inline-block}
  .refs{font-size:12px;color:var(--muted);padding-left:18px}
  .refs li{margin-bottom:8px}
  .end-sentinel{
    margin:16px 18px 0;padding:10px;border-radius:12px;
    background:#F1F5F1;color:var(--primary-dark);text-align:center;
    font-size:12px;font-weight:700;
  }
  .chapter-foot{padding:12px 18px 18px}
  .finish-btn{width:100%;font-size:14px;min-height:44px}
  .finish-btn.is-done{background:var(--primary-soft);color:var(--primary-dark);border-color:#CFE1DB}

  /* Lock */
  .lock-card{text-align:center;padding:28px 20px}
  .lock-icon{font-size:52px;line-height:1}
  .lock-card h3{margin:12px 0 6px;font-size:19px}
  .lock-card p{color:var(--muted);font-size:14px;margin:0 0 16px}
  .unread-box{text-align:left;background:#FFF8EC;border-radius:14px;padding:12px 14px;margin:16px 0;font-size:13px}
  .unread-box b{display:block;margin-bottom:6px}

  /* Quiz */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
  .dots{display:flex;gap:5px;flex-wrap:wrap}
  .dots i{width:9px;height:9px;border-radius:50%;background:#DDD5C9;display:block}
  .dots i.cur{background:var(--accent);transform:scale(1.25)}
  .dots i.ok{background:var(--success)}
  .dots i.no{background:var(--danger)}
  .q-card h3{font-size:19px;line-height:1.5;margin:6px 0 16px}
  .q-tag{font-size:11px;color:var(--primary-dark);background:var(--primary-soft);padding:3px 9px;border-radius:99px}
  .options{display:grid;gap:9px;margin-bottom:14px}
  .option{
    display:flex;align-items:center;gap:11px;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:12px 13px;font-size:14px;color:var(--ink);min-height:52px;
    transition:border-color .15s,background .15s;
  }
  .option:hover:not(:disabled){border-color:var(--primary)}
  .option .letter{
    width:28px;height:28px;flex:none;border-radius:9px;background:#F0EAE0;
    display:grid;place-items:center;font-weight:800;font-size:12px;color:#7A6F62;
  }
  .option.correct{border-color:var(--success);background:#EAF6F0}
  .option.correct .letter{background:var(--success);color:#fff}
  .option.wrong{border-color:var(--danger);background:var(--danger-soft)}
  .option.wrong .letter{background:var(--danger);color:#fff}
  .option:disabled{cursor:default}
  .feedback{border-radius:16px;padding:14px;margin:12px 0;font-size:14px;animation:pop .25s ease}
  .feedback.ok{background:#EAF6F0;border-left:4px solid var(--success)}
  .feedback.no{background:var(--danger-soft);border-left:4px solid var(--danger)}
  .feedback strong{display:block;margin-bottom:4px}
  .feedback p{margin:0 0 8px}
  .feedback a{font-size:13px;font-weight:700}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .result-hero{text-align:center;padding:24px 18px}
  .score-ring{
    width:132px;height:132px;margin:0 auto 14px;border-radius:50%;
    display:grid;place-items:center;
    background:conic-gradient(var(--primary) calc(var(--p) * 1%), #E6DED3 0);
  }
  .score-ring > div{
    width:108px;height:108px;border-radius:50%;background:var(--paper);
    display:grid;place-content:center;
  }
  .score-ring b{font-size:32px;line-height:1;color:var(--primary-dark)}
  .score-ring span{font-size:11px;color:var(--muted)}
  .result-hero h3{margin:0 0 6px;font-size:21px}
  .result-hero p{margin:0;color:var(--muted);font-size:14px}
  .review-item{
    display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px
  }
  .review-item:last-child{border-bottom:0}
  .review-item .mark{font-weight:800;flex:none}
  .review-item .mark.no{color:var(--danger)}
  .review-item a{display:block;font-size:12px;margin-top:2px}

  /* Profile / feedback */
  .ring-small{
    width:78px;height:78px;flex:none;border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--p) * 1%), #E6DED3 0);
    display:grid;place-items:center;
  }
  .ring-small > div{width:62px;height:62px;border-radius:50%;background:var(--paper);display:grid;place-content:center;text-align:center}
  .ring-small b{font-size:17px;line-height:1}
  .ring-small span{font-size:9px;color:var(--muted)}
  .profile-row{display:flex;align-items:center;gap:14px}
  .kv{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}
  .kv b{color:var(--primary-dark)}
  .action-item{
    display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px
  }
  .action-item:last-child{border-bottom:0}
  .action-item input{margin-top:5px;width:19px;height:19px;accent-color:var(--primary);flex:none}
  .action-item.checked{color:var(--muted);text-decoration:line-through}
  .stars{display:flex;gap:6px;margin:8px 0}
  .star{
    border:0;background:transparent;font-size:30px;line-height:1;padding:2px;color:#D8D0C4;
  }
  .star.on{color:var(--accent)}
  textarea{
    width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);
    border-radius:14px;padding:12px;background:#fff;color:var(--ink);font-size:14px;
  }
  textarea:focus,button:focus-visible{outline:3px solid rgba(47,125,114,.35);outline-offset:2px}

  /* Tab bar + toast */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:min(480px,100%);z-index:40;
    display:grid;grid-template-columns:repeat(4,1fr);
    background:rgba(255,253,248,.97);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    border:0;background:transparent;color:var(--muted);
    display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:12px;
    font-size:11px;font-weight:700;position:relative;
  }
  .tab .ic{font-size:20px;line-height:1}
  .tab[aria-selected="true"]{color:var(--primary-dark);background:var(--primary-soft)}
  .tab .badge{
    position:absolute;top:2px;right:calc(50% - 20px);
    background:var(--accent);color:#fff;font-size:9px;
    border-radius:99px;padding:0 5px;line-height:15px;
  }
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);
    z-index:60;background:#263445;color:#fff;padding:11px 18px;
    border-radius:99px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    max-width:calc(100% - 32px);text-align:center;
    box-shadow:0 10px 24px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .disclaimer{font-size:11px;color:#8B857A;text-align:center;padding:8px 4px 4px;line-height:1.6}

  @media (min-width:520px){
    body{padding:18px 0}
    .app{border-radius:28px;min-height:calc(100vh - 36px)}
    .tabbar{bottom:18px;border-radius:0 0 28px 28px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🛡️</div>
      <div class="brand-text">
        <h1>安心不跌倒</h1>
        <p>高齡者跌倒預防 · 互動衛教</p>
      </div>
    </div>
    <div class="progress-strip" aria-label="閱讀進度">
      <span>閱讀進度</span>
      <span class="bar"><i id="progressBar"></i></span>
      <b id="progressText">0/7</b>
    </div>
  </header>

  <main class="view" id="view"></main>

  <nav class="tabbar" aria-label="主要導覽">
    <button class="tab" data-tab="home" aria-selected="true"><span class="ic">🏠</span>首頁</button>
    <button class="tab" data-tab="read" aria-selected="false"><span class="ic">📖</span>衛教內容</button>
    <button class="tab" data-tab="quiz" aria-selected="false"><span class="ic">✅</span>Q&amp;A 測驗<span class="badge" id="quizBadge">鎖</span></button>
    <button class="tab" data-tab="profile" aria-selected="false"><span class="ic">⭐</span>我的學習</button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var STORE_KEY = 'fallPreventionApp.v1';
  var view = document.getElementById('view');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var readObserver = null;

  var CHAPTERS = [
    {
      id:'intro', no:'01', icon:'📌', title:'前言與認識跌倒', range:'投影片 3–5',
      body:[
        '<h4>為什麼要談跌倒？</h4>',
        '<p>根據衛生福利部國民健康署的調查，65 歲以上的高齡者中，<strong>約每 6 人就有 1 人（占 15.5%）</strong>在過去一年內曾發生過跌倒。</p>',
        '<p>隨著年齡增加，高齡者的肌力、平衡感與視力可能逐漸下降；加上居家環境、疾病或藥物等因素，都可能提高跌倒的風險。</p>',
        '<div class="callout">跌倒可能造成骨折、頭部受傷，也可能影響日常生活與活動能力。因此認識原因、預防方式與跌倒後的正確處理，是非常重要的。</div>',
        '<h4>高齡者為什麼容易跌倒</h4>',
        '<div class="fact-grid">',
        '<div class="fact"><b>🦵 身體因素</b><span>肌力下降、平衡感變差、視力退化</span></div>',
        '<div class="fact"><b>💊 疾病／藥物因素</b><span>慢性疾病、服用多種藥物</span></div>',
        '<div class="fact"><b>🏠 環境因素</b><span>地面濕滑、雜物阻礙、光線不足</span></div>',
        '<div class="fact"><b>🚶 行為因素</b><span>不合適鞋子、走路太快</span></div>',
        '</div>',
        '<h4>影片賞析</h4>',
        '<a class="video-card" href="https://www.youtube.com/results?search_query=%E8%80%81%E4%BA%BA%E8%B7%8C%E5%80%92+%E8%B7%8C%E5%80%92%E9%A0%90%E9%98%B2+%E8%B7%8C%E5%80%92%E6%87%89%E5%B0%8D+%E4%B8%8B%E8%82%A2%E8%82%8C%E5%8A%9B%E5%A2%9E%E5%BC%B7" target="_blank" rel="noopener noreferrer">',
        '<span class="play" aria-hidden="true">▶</span>',
        '<span><strong>老人跌倒｜跌倒預防｜跌倒應對｜下肢肌力增強</strong><small>點此前往 YouTube 搜尋簡報提及影片（外部網站）</small></span></a>',
        '<p class="note">資料來源：邱韋瑄等人（2022）；林書存、張淑芳（2024）。</p>'
      ].join('')
    },
    {

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var saved = JSON.parse(raw);
        state.read = saved.read || {};
        state.scrolled = saved.scrolled || {};
        state.best = typeof saved.best === 'number' ? saved.best : null;
        state.actions = saved.actions || {};
        state.feedback = saved.feedback || state.feedback;
      }
    }catch(e){}
  }
  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        read:state.read, scrolled:state.scrolled, best:state.best,
        actions:state.actions, feedback:state.feedback
      }));
    }catch(e){}
  }
  function chapterById(id){
    for(var i=0;i<CHAPTERS.length;i++){ if(CHAPTERS[i].id===id) return CHAPTERS[i]; }
    return null;

  function readCount(){
    return CHAPTERS.filter(function(c){return !!state.read[c.id];}).length;
  }
  function unlocked(){ return readCount()===CHAPTERS.length; }
  function unreadChapters(){ return CHAPTERS.filter(function(c){return !state.read[c.id];}); }

    readObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var id = en.target.dataset.ch;
        if(id && !state.scrolled[id]){
          state.scrolled[id] = true;
          var btn = view.querySelector('[data-action="finish-ch"][data-ch="'+id+'"]');
          if(btn && !state.read[id]){
            btn.disabled = false;
            btn.textContent = '我讀完了，標記完成';
          }
          save();
        }
      });
    },{threshold:0.5});
    var sentinels = view.querySelectorAll('.end-sentinel');
    Array.prototype.forEach.call(sentinels,function(el){ readObserver.observe(el); });
  }

  function markRead(id){
    if(!state.scrolled[id]) return;
    if(state.read[id]) return;
    state.read[id] = true;
    var before = unlocked();
    save();
    var btn = view.querySelector('[data-action="finish-ch"][data-ch="'+id+'"]');
    if(btn){ btn.disabled=true; btn.classList.add('is-done'); btn.textContent='✓ 已標記讀完'; }
    updateProgress();
    if(unlocked() && !before){ toast('🎉 所有內容已讀完，Q&A 測驗解鎖！'); }
    else { toast('已記錄：「'+(chapterById(id)||{}).title+'」'); }
  }

  function goChapter(id){
    switchTab('read');
    setTimeout(function(){
      var el = document.getElementById('ch-'+id);
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    },120);
  }

  function renderQuiz(){
    if(!unlocked()){
      var missing = unreadChapters().map(function(c){return '<li>'+c.no+'　'+c.title+'</li>';}).join('');
      view.innerHTML =
        '<div class="page-head"><span class="eyebrow">立即回饋</span><h2>Q&amp;A 測驗</h2><p>需要先讀完全部衛教內容，才能進入測驗。</p></div>'+
        '<div class="card lock-card">'+
          '<div class="lock-icon">🔒</div>'+
          '<h3>還有 '+unreadChapters().length+' 章尚未讀完</h3>'+
          '<p>這是為了讓每個人都先看過完整衛教資訊，再進行測驗與回饋。</p>'+
          '<div class="unread-box"><b>待閱讀章節</b><ul style="margin:0;padding-left:18px">'+missing+'</ul></div>'+
          '<button class="btn btn-primary btn-block" data-action="start-read">去完成閱讀</button>'+
        '</div>'+
        '<p class="disclaimer">小提醒：每一章滑到結尾，按「我讀完了」就會自動記錄。</p>';
      return;
    }

    if(state.quiz.mode==='intro'){
      view.innerHTML =
        '<div class="page-head"><span class="eyebrow">閱讀完成 · 測驗開放</span><h2>Q&amp;A 測驗</h2><p>共 '+QUESTIONS.length+' 題。選完答案會立即說明原因，並可回到對應章節再看一次。</p></div>'+
        '<div class="card" style="text-align:center;padding:26px 20px">'+
          '<div style="font-size:50px;line-height:1">🧠</div>'+
          '<h3 style="margin:12px 0 6px">準備好了嗎？</h3>'+
          '<p class="note" style="font-size:14px">前 4 題取自原簡報 Q&amp;A，其餘題目延伸自簡報內容。</p>'+
          '<button class="btn btn-primary btn-block" data-action="start-quiz" style="margin-top:18px">開始測驗</button>'+
          (state.best!==null?'<p class="note">目前最佳成績：<b>'+state.best+' / '+QUESTIONS.length+'</b></p>':'')+
        '</div>';
      return;
    }

    if(state.quiz.mode==='result'){ renderResult(); return; }
    renderQuestion();
  }

  function renderQuestion(){
    var idx = state.quiz.idx;
    var q = QUESTIONS[idx];
    var answered = state.quiz.answered;
    var dots = QUESTIONS.map(function(_,i){
      var cls = '';
      if(i<idx){
        var ans = state.quiz.answers[i];
        cls = ans && ans.correct ? 'ok' : 'no';
      } else if(i===idx){ cls='cur'; }
      return '<i class="'+cls+'"></i>';
    }).join('');
    var opts = q.opts.map(function(text,i){
      var cls='';
      if(answered!==null){
        if(i===q.a) cls='correct';
        else if(i===answered) cls='wrong';
      }
      return '<button class="option '+cls+'" data-action="answer" data-i="'+i+'" '+(answered!==null?'disabled':'')+'>'+
        '<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(text)+'</span></button>';
    }).join('');

    var feedback = '';
    if(answered!==null){
      var ok = answered===q.a;
      feedback =
        '<div class="feedback '+(ok?'ok':'no')+'" role="status">'+
          '<strong>'+(ok?'✅ 答對了！':'❌ 再想一想')+'</strong>'+
          '<p>'+(ok?q.why:'正確答案：<b>'+esc(q.opts[q.a])+'</b><br>'+q.why)+'</p>'+
          '<a href="#" data-action="goto-ch" data-ch="'+q.ch+'">↩ 回到「'+(chapterById(q.ch)||{}).title+'」再看一次</a>'+
        '</div>'+
        '<button class="btn btn-primary btn-block" data-action="next-q">'+(idx===QUESTIONS.length-1?'查看測驗結果':'下一題 →')+'</button>';
    }

    view.innerHTML =
      '<div class="quiz-top"><span>第 '+(idx+1)+' / '+QUESTIONS.length+' 題</span><span class="dots">'+dots+'</span></div>'+
      '<div class="card q-card">'+
        '<span class="q-tag">'+(q.orig?'原簡報 Q&A':'簡報延伸題')+'</span>'+
        '<h3>'+esc(q.q)+'</h3>'+
        '<div class="options">'+opts+'</div>'+
        feedback+
      '</div>';
  }

  function answerQuestion(i){
    if(state.quiz.mode!=='playing' || state.quiz.answered!==null) return;
    var q = QUESTIONS[state.quiz.idx];
    var ok = i===q.a;
    state.quiz.answered = i;
    state.quiz.answers[state.quiz.idx] = {qid:q.id, choice:i, correct:ok, ch:q.ch};
    renderQuestion();
    if(ok) toast('答對了！'); else toast('已提供正確答案與說明');
  }

  function nextQuestion(){
    if(state.quiz.idx < QUESTIONS.length-1){
      state.quiz.idx++;
      state.quiz.answered = null;
      renderQuestion();
      window.scrollTo({top:0,behavior:'smooth'});
    }else{
      var score = state.quiz.answers.filter(function(a){return a && a.correct;}).length;
      if(state.best===null || score>state.best){ state.best=score; save(); }
      state.quiz.mode='result';
      renderQuiz();
      window.scrollTo({top:0,behavior:'smooth'});
    }
  }

  function renderResult(){
    var answers = state.quiz.answers;
    var score = answers.filter(function(a){return a && a.correct;}).length;
    var pct = Math.round(score/QUESTIONS.length*100);
    var tier = score>=9 ? ['🏆','安全守護者！','你已掌握防跌重點，記得把這些習慣落實在日常生活中。']
             : score>=7 ? ['👏','表現不錯！','再回顧答錯的章節，讓觀念更穩固。']
             : ['💪','再讀一次會更好','別擔心，回到衛教內容看完後再重新挑戰。'];
    var wrong = answers.map(function(a,i){
      return a && !a.correct ? {q:QUESTIONS[i], ch:a.ch} : null;
    }).filter(Boolean);
    var review = wrong.length
      ? wrong.map(function(w){
          return '<div class="review-item"><span class="mark no">✕</span><div>'+esc(w.q.q)+
            '<a href="#" data-action="goto-ch" data-ch="'+w.ch+'">回「'+(chapterById(w.ch)||{}).title+'」複習</a></div></div>';
        }).join('')
      : '<p class="note" style="text-align:center">全部答對，沒有需要複習的題目！</p>';

    view.innerHTML =
      '<div class="page-head"><span class="eyebrow">測驗完成</span><h2>你的學習回饋</h2><p>根據答題結果，我們整理了適合你的複習建議。</p></div>'+
      '<div class="card result-hero">'+
        '<div class="score-ring" style="--p:'+pct+'"><div><b>'+score+'</b><span>/ '+QUESTIONS.length+' 題</span></div></div>'+
        '<div style="font-size:30px">'+tier[0]+'</div>'+
        '<h3>'+tier[1]+'</h3><p>'+tier[2]+'</p>'+
        '<p class="note">'+(state.best!==null?'最佳成績：'+state.best+' / '+QUESTIONS.length:'')+'</p>'+
      '</div>'+
      '<div class="card"><h3>📝 答錯題目複習</h3>'+review+'</div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-primary" data-action="retake">再測一次</button>'+
        '<button class="btn btn-ghost" data-action="go-profile">看我的學習</button>'+
      '</div>'+
      '<p class="disclaimer">回饋依據本簡報內容產生，僅供衛教學習參考。</p>';
  }

  function renderProfile(){
    var n = readCount(), total = CHAPTERS.length;
    var pct = Math.round(n/total*100);
    var doneActions = ACTIONS.filter(function(a){return !!state.actions[a.id];}).length;
    var stars = [1,2,3,4,5].map(function(i){
      return '<button class="star '+(i<=state.feedback.rating?'on':'')+'" data-action="rate" data-i="'+i+'" aria-label="'+i+' 星">★</button>';
    }).join('');
    var chapterRows = CHAPTERS.map(function(c){
      return '<span class="pill" style="background:'+(state.read[c.id]?'#E4F1ED':'#F0EAE0')+';color:'+(state.read[c.id]?'#235F57':'#6C6255')+'">'+
        (state.read[c.id]?'✓ ':'○ ')+c.title+'</span>';
    }).join('');

    view.innerHTML =
      '<div class="page-head"><span class="eyebrow">學習紀錄</span><h2>我的學習</h2><p>進度會保存在此裝置，下次打開可以接著看。</p></div>'+
      '<div class="card"><div class="profile-row">'+
        '<div class="ring-small" style="--p:'+pct+'"><div><b>'+pct+'%</b><span>閱讀</span></div></div>'+
        '<div><strong>已讀 '+n+' / '+total+' 章</strong><p class="note" style="margin:4px 0 0">'+(unlocked()?'Q&A 測驗已解鎖':'讀完全部章節即可解鎖 Q&A')+'</p></div>'+
      '</div><div class="tag-row" style="margin-top:14px">'+chapterRows+'</div></div>'+

      '<div class="card"><h3>🏅 學習成果</h3>'+
        '<div class="kv"><span>Q&A 最佳成績</span><b>'+(state.best!==null?state.best+' / '+QUESTIONS.length:'尚未測驗')+'</b></div>'+
        '<div class="kv"><span>安全行動打卡</span><b>'+doneActions+' / '+ACTIONS.length+'</b></div>'+
        '<div class="kv"><span>測驗狀態</span><b>'+(unlocked()?'已解鎖':'未解鎖')+'</b></div>'+
      '</div>'+

      '<div class="card"><h3>✅ 今日安全行動</h3>'+
        '<p class="note" style="font-size:13px">勾選今天做到的事，給自己一點正向回饋。</p>'+
        ACTIONS.map(function(a){
          var checked = !!state.actions[a.id];
          return '<label class="action-item '+(checked?'checked':'')+'">'+
            '<input type="checkbox" data-action="toggle-action" data-id="'+a.id+'" '+(checked?'checked':'')+'>'+
            '<span>'+a.text+'　<a href="#" data-action="goto-ch" data-ch="'+a.ch+'" style="font-size:11px">看內容</a></span></label>';
        }).join('')+
      '</div>'+

      '<div class="card tint"><h3>💬 給這份資料回饋</h3>'+
        (state.feedback.sent
          ? '<div class="callout">謝謝您的回饋！意見已記錄在此裝置。'+(state.feedback.rating?'您給了 '+state.feedback.rating+' 星。':'')+'</div>'
          : '<p class="note" style="font-size:13px">你的評分與文字僅存在此裝置，不會上傳到任何伺服器。</p>'+
            '<div class="stars" role="group" aria-label="滿意度評分">'+stars+'</div>'+
            '<textarea id="feedbackText" placeholder="寫下你覺得實用的地方，或建議調整的內容…">'+esc(state.feedback.text)+'</textarea>'+
            '<button class="btn btn-primary btn-block" data-action="submit-feedback" style="margin-top:10px">送出回饋</button>')+
      '</div>'+

      '<button class="btn btn-ghost btn-block" data-action="reset-all" style="color:var(--danger);border-color:#EBC9C6">清除全部學習紀錄</button>'+
      '<p class="disclaimer">內容整理自「高齡者跌倒預防」簡報（輔英科技大學 教學原理與方法）。</p>';
  }

  function render(){
    updateProgress();
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(btn){
      btn.setAttribute('aria-selected', btn.dataset.tab===state.tab ? 'true':'false');
    });
    if(state.tab==='home') renderHome();
    else if(state.tab==='read') renderRead();
    else if(state.tab==='quiz') renderQuiz();
    else renderProfile();
  }

  /* ---------- Events ---------- */
  document.querySelector('.tabbar').addEventListener('click',function(e){
    var btn = e.target.closest('[data-tab]');
    if(btn) switchTab(btn.dataset.tab);
  });

  view.addEventListener('click',function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    e.preventDefault();

    if(action==='start-read'){ switchTab('read'); }
    else if(action==='go-quiz'){ switchTab('quiz'); }
    else if(action==='go-profile'){ switchTab('profile'); }
    else if(action==='finish-ch'){ markRead(el.dataset.ch); }
    else if(action==='goto-ch'){ goChapter(el.dataset.ch); }
    else if(action==='start-quiz' || action==='retake'){
      state.quiz = {mode:'playing',idx:0,answered:null,answers:[]};
      renderQuiz(); window.scrollTo({top:0,behavior:'smooth'});
    }
    else if(action==='answer'){ answerQuestion(parseInt(el.dataset.i,10)); }
    else if(action==='next-q'){ nextQuestion(); }
    else if(action==='rate'){
      state.feedback.rating = parseInt(el.dataset.i,10);
      Array.prototype.forEach.call(view.querySelectorAll('.star'),function(s){
        s.classList.toggle('on', parseInt(s.dataset.i,10)<=state.feedback.rating);
      });
      save();
    }
    else if(action==='submit-feedback'){
      var ta = document.getElementById('feedbackText');
      state.feedback.text = ta ? ta.value : '';
      state.feedback.sent = true;
      save(); renderProfile(); toast('謝謝您的回饋！');
    }
    else if(action==='reset-all'){
      if(window.confirm('確定要清除所有閱讀進度、成績與回饋嗎？此動作無法復原。')){
        var tab = state.tab;
        state = defaultState(); state.tab = tab; save(); render(); toast('已清除全部紀錄');
      }
    }
  });

  view.addEventListener('change',function(e){
    var el = e.target.closest('[data-action="toggle-action"]');
    if(!el) return;
    var id = el.dataset.id;
    state.actions[id] = el.checked;
    save();
    el.closest('.action-item').classList.toggle('checked', el.checked);
    var count = ACTIONS.filter(function(a){return !!state.actions[a.id];}).length;
    if(el.checked && count===ACTIONS.length) toast('🎉 今日安全行動全部完成！');
    else if(el.checked) toast('很棒！又完成一項安全行動');
    var kv = view.querySelectorAll('.kv b');
    if(kv[1]) kv[1].textContent = count+' / '+ACTIONS.length;
  });

  load();
  render();
})();
</script>
</body>
</html>
